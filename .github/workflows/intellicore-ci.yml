
name: IntelliCore CI

on:
  push:
    branches:
      - main
      - develop
      - bhumi
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Run Ruff
        run: ruff check . --select E4,E7,E9,F --ignore F841

      - name: Run Python tests
        run: |
          if find . -type f -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pytest -v
          else
            echo "No Python tests found."
          fi

  ingestion-service-tests:
    name: Ingestion Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ingestion tests
        run: pytest -v tests/

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Node.js types
        run: npm install --no-save @types/node@20.17.6

      - name: Run lint
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build --if-present

  tauri-rust-checks:
    name: Tauri and Rust Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust project
        run: |
          if find . -name Cargo.toml -not -path "./.git/*" | grep -q .; then
            cargo check --manifest-path "$(find . -name Cargo.toml -not -path "./.git/*" | head -n 1)"
          else
            echo "No Rust project found. Skipping."
          fi

  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          found=0
          while IFS= read -r dockerfile; do
            found=1
            context="$(dirname "$dockerfile")"
            echo "Checking $dockerfile"
            docker build --check -f "$dockerfile" "$context"
          done < <(find . -type f -name Dockerfile -not -path "./.git/*" -size +0c)

          if [ "$found" -eq 0 ]; then
            echo "No non-empty Dockerfiles found. Skipping."
          fi

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  ci-status:
    name: IntelliCore CI Status
    runs-on: ubuntu-latest
    needs:
      - python-checks
      - ingestion-service-tests
      - frontend-checks
      - tauri-rust-checks
      - docker-validation
      - security-checks
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.python-checks.result }}" != "success" ] ||
             [ "${{ needs.ingestion-service-tests.result }}" != "success" ] ||
             [ "${{ needs.frontend-checks.result }}" != "success" ] ||
             [ "${{ needs.tauri-rust-checks.result }}" != "success" ] ||
             [ "${{ needs.docker-validation.result }}" != "success" ] ||
             [ "${{ needs.security-checks.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
