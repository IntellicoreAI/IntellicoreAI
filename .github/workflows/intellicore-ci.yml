```yaml
name: IntelliCore CI

on:
  push:
    branches:
      - main
      - develop
      - bhumi
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # PYTHON / FASTAPI / ML / LLM CHECKS
  # ============================================================
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Python project
        id: python-project
        shell: bash
        run: |
          if [ -f "requirements.txt" ] || find . -name "*.py" -not -path "./.git/*" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Python project detected. Python checks will be skipped."
          fi

      - name: Set up Python
        if: steps.python-project.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.python-project.outputs.exists == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          pip install ruff pytest

      - name: Check Python files
        if: steps.python-project.outputs.exists == 'true'
        run: |
          ruff check .

      - name: Run Python tests
        if: steps.python-project.outputs.exists == 'true'
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) -not -path "./.git/*" | grep -q .; then
            pytest
          else
            echo "No Python tests found. Skipping pytest."
          fi


  # ============================================================
  # CENTRAL INGESTION SERVICE TESTS
  # ============================================================
  ingestion-service-tests:
    name: Ingestion Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingestion-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ingestion service tests
        run: |
          pytest -v tests/


  # ============================================================
  # NEXT.JS / REACT DASHBOARD CHECKS
  # ============================================================
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend project
        id: frontend-project
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No dashboard package.json found. Frontend checks will be skipped."
          fi

      - name: Set up Node.js
        if: steps.frontend-project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend-project.outputs.exists == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install missing TypeScript definitions
        if: steps.frontend-project.outputs.exists == 'true'
        run: |
          npm install --no-save @types/node@20.17.6

      - name: Run frontend lint
        if: steps.frontend-project.outputs.exists == 'true'
        run: |
          npm run lint --if-present

      - name: Build frontend
        if: steps.frontend-project.outputs.exists == 'true'
        run: |
          npm run build --if-present


  # ============================================================
  # TAURI / RUST CHECKS
  # ============================================================
  tauri-rust-checks:
    name: Tauri / Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Rust project
        id: rust-project
        shell: bash
        run: |
          if find . -name "Cargo.toml" -not -path "./.git/*" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Rust/Tauri project detected. Rust checks will be skipped."
          fi

      - name: Set up Rust
        if: steps.rust-project.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust formatting check
        if: steps.rust-project.outputs.exists == 'true'
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        if: steps.rust-project.outputs.exists == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        if: steps.rust-project.outputs.exists == 'true'
        run: cargo test --all


  # ============================================================
  # DOCKER CHECKS
  # ============================================================
  docker-validation:
    name: Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for non-empty Dockerfiles
        id: docker-project
        shell: bash
        run: |
          if find . -type f -name "Dockerfile" \
            -not -path "./.git/*" -size +0c | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No non-empty Dockerfiles found. Docker validation will be skipped."
          fi

      - name: Set up Docker Buildx
        if: steps.docker-project.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        if: steps.docker-project.outputs.exists == 'true'
        shell: bash
        run: |
          while IFS= read -r dockerfile; do
            context="$(dirname "$dockerfile")"
            echo "Validating: $dockerfile"
            docker build --check -f "$dockerfile" "$context"
          done < <(find . -type f -name "Dockerfile" \
            -not -path "./.git/*" -size +0c)


  # ============================================================
  # SECURITY / SECRET SCANNING
  # ============================================================
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown


  # ============================================================
  # FINAL CI GATE
  # ============================================================
  ci-status:
    name: IntelliCore CI Status
    runs-on: ubuntu-latest

    needs:
      - python-checks
      - ingestion-service-tests
      - frontend-checks
      - tauri-rust-checks
      - docker-validation
      - security-checks

    if: always()

    steps:
      - name: Check all CI jobs
        shell: bash
        run: |
          if [[ "${{ needs.python-checks.result }}" != "success" ||
                "${{ needs.ingestion-service-tests.result }}" != "success" ||
                "${{ needs.frontend-checks.result }}" != "success" ||
                "${{ needs.tauri-rust-checks.result }}" != "success" ||
                "${{ needs.docker-validation.result }}" != "success" ||
                "${{ needs.security-checks.result }}" != "success" ]]; then

            echo "One or more CI checks failed."
            exit 1
          fi

          echo "All IntelliCore CI checks passed successfully."
```
