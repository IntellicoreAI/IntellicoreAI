[project]
name = "intellicore-llm-monitoring"
version = "0.1.0"
description = "LLM quality, safety, reliability and telemetry monitoring for IntelliCore AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "prometheus-client>=0.21,<1.0",
  "jsonschema>=4.23,<5.0",
  "python-dotenv>=1.0,<2.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.28,<1.0"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
