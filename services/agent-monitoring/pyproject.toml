[project]
name = "intellicore-agent-monitoring"
version = "0.1.0"
description = "Agentic AI monitoring service for IntelliCore AI"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "langgraph>=0.6,<1.0",
    "langchain-core>=0.3,<1.0",
    "redis>=6.0,<7.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"