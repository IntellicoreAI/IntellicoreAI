[project]
name = "intellicore-diagnosis-service"
version = "0.1.0"
description = "Cross-paradigm (LLM + Agentic) diagnosis engine for IntelliCore AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
markers = ["pg: needs a PostgreSQL DATABASE_URL"]
